# End-to-end tests: a real browser (Playwright) drives the app like an attendant would.
# Fully isolated from the dev stack (own project name, throwaway database in memory):
#
#   docker compose -f docker-compose.e2e.yaml up --build --abort-on-container-exit --exit-code-from e2e
#   docker compose -f docker-compose.e2e.yaml down -v
#
# Reports/screenshots of failures land in ./e2e/test-results and ./e2e/playwright-report.
name: hotel-e2e

services:
  db:
    image: postgres:16-alpine
    tmpfs:
      - /var/lib/postgresql/data
    environment:
      POSTGRES_DB: hotel
      POSTGRES_USER: hotel
      POSTGRES_PASSWORD: hotel
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel -d hotel"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build: ./backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_demo --guests 55 --user atendente --password senha-forte-123 &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      DB_NAME: hotel
      DB_USER: hotel
      DB_PASSWORD: hotel
      DB_HOST: db
      DB_PORT: "5432"
      DJANGO_SECRET_KEY: e2e-only-not-a-secret
      DJANGO_DEBUG: "True"
      # The browser reaches the app as http://frontend:5173 (Vite proxies /api here).
      DJANGO_ALLOWED_HOSTS: localhost,backend,frontend
      DJANGO_CSRF_TRUSTED_ORIGINS: http://frontend:5173
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/auth/csrf/')"]
      interval: 3s
      timeout: 5s
      retries: 40

  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

  e2e:
    image: mcr.microsoft.com/playwright:v1.49.1-noble
    working_dir: /e2e
    command: sh -c "npm install --no-audit --no-fund && npx playwright test"
    volumes:
      - ./e2e:/e2e
    environment:
      BASE_URL: http://frontend:5173
      E2E_USER: atendente
      E2E_PASSWORD: senha-forte-123
      CI: "1"
      E2E_VIDEO: "${E2E_VIDEO:-}"
    depends_on:
      - frontend

  # Interactive mode: `docker compose -f docker-compose.e2e.yaml --profile ui up --build e2e-ui`
  # then open http://localhost:8080 (pick tests, run them, watch each step with time travel).
  e2e-ui:
    profiles: ["ui"]
    image: mcr.microsoft.com/playwright:v1.49.1-noble
    working_dir: /e2e
    command: sh -c "npm install --no-audit --no-fund && npx playwright test --ui-host=0.0.0.0 --ui-port=8080"
    ports:
      - "8080:8080"
    volumes:
      - ./e2e:/e2e
    environment:
      BASE_URL: http://frontend:5173
      E2E_USER: atendente
      E2E_PASSWORD: senha-forte-123
    depends_on:
      - frontend
